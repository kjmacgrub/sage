<title>Trade Log Pivot</title>
<style>
/* Layout: a filter rail on the left, one pivot table on the right; strategy > year > open date, collapsing at each level. */
:root {
  --bg: #f6f7f4;
  --surface: #ffffff;
  --fg: #1d221b;
  --muted: #6b736a;
  --line: #dde2d8;
  --accent: #5a7a52;
  --accent-soft: #e7eee3;
  --pos: #2f7d4f;
  --neg: #b23a3a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141714; --surface: #1c201b; --fg: #e8ebe4; --muted: #9aa297;
    --line: #2d332b; --accent: #8fb283; --accent-soft: #24301f;
    --pos: #6fc48f; --neg: #e07a7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141714; --surface: #1c201b; --fg: #e8ebe4; --muted: #9aa297;
  --line: #2d332b; --accent: #8fb283; --accent-soft: #24301f;
  --pos: #6fc48f; --neg: #e07a7a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; margin: 0; padding-block: 20px; padding-inline: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 14px; }
.top .meta { color: var(--muted); font-size: 13px; }
.top .actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 6px 12px; font-size: 13px; }
button.primary:hover { filter: brightness(1.08); }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 720px) { .rail { position: static; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.panel h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
.strat-list { display: flex; flex-direction: column; gap: 6px; }
.strat-list label { display: flex; align-items: center; gap: 8px; cursor: pointer; line-height: 1.3; }
.strat-list input { accent-color: var(--accent); margin: 0; width: 15px; height: 15px; }
.strat-list .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
button { font: inherit; font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px 12px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.4; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.drop strong { color: var(--fg); font-weight: 600; }
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); z-index: 1; }
tr.strategy td { background: var(--accent-soft); font-weight: 600; cursor: pointer; }
tr.year td { font-weight: 500; cursor: pointer; }
tr.year td:first-child { padding-left: 32px; }
tr.day td { color: var(--fg); }
tr.day td:first-child { padding-left: 56px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
tr.strategy:hover td, tr.year:hover td { filter: brightness(0.97); }
tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; background: var(--surface); }
.tri { display: inline-block; width: 14px; color: var(--muted); font-size: 10px; transition: transform .12s; }
.collapsed .tri { transform: rotate(-90deg); }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.err { color: var(--neg); font-size: 12.5px; margin-top: 8px; }
@media (prefers-reduced-motion: reduce) { .tri { transition: none; } }
</style>

<div class="top">
  <h1>Trade Log Pivot</h1>
  <span class="meta" id="meta"></span>
  <div class="actions">
    <button type="button" class="primary" id="uploadBtn" title="Replace what is loaded with one or more Option Omega trade-log CSVs">Upload trade log</button>
    <button type="button" id="appendBtn" title="Merge more trade-log CSVs into what is already loaded">Add to current</button>
    <input type="file" id="file" class="vh" accept=".csv,text/csv" multiple>
    <input type="file" id="fileAppend" class="vh" accept=".csv,text/csv" multiple>
  </div>
</div>

<div class="wrap">
  <aside class="rail">
    <div class="panel">
      <h2>Strategies</h2>
      <div class="strat-list" id="stratList"></div>
      <div class="btns">
        <button type="button" id="allOn">All on</button>
        <button type="button" id="allOff">All off</button>
      </div>
    </div>
    <div class="panel">
      <h2>Rows</h2>
      <div class="btns" style="margin-top:0">
        <button type="button" id="expandYears">Show years</button>
        <button type="button" id="expandDays">Show every date</button>
        <button type="button" id="collapseAll">Collapse all</button>
      </div>
    </div>
    <div class="drop" id="drop" role="button" tabindex="0">
      <strong>Drop trade logs here</strong><br>Option Omega CSVs · several at once is fine · drop replaces, use <em>Add to current</em> to merge
    </div>
    <div class="err" id="err" hidden></div>
  </aside>

  <div class="tablewrap">
    <table id="pivot">
      <thead><tr><th>Strategy / open date</th><th>Trades</th><th>Contracts</th><th>P/L</th></tr></thead>
      <tbody id="body"></tbody>
      <tfoot><tr><td>Total (shown strategies)</td><td id="tTrades"></td><td id="tCtr"></td><td id="tPl"></td></tr></tfoot>
    </table>
  </div>
</div>

const SEED_NAME = "trade-log - 2026-10-09T165319.712.csv";

let rawRows = [];          // every row currently loaded, so later uploads can merge
let loadedNames = [];      // file names behind rawRows
let trades = [];           // [{s, d, y, c, pl}]
let strategies = [];       // names in order of first appearance
let enabled = new Set();
let openStrat = new Set(); // collapsed state: strategies expanded to years
let openYear = new Set();  // "strategy|year" expanded to days

function groupTrades(rows) {
  const map = new Map();
  for (const [s, d, t, c, pl] of rows) {
    const k = s + '|' + d + '|' + t;
    let tr = map.get(k);
    if (!tr) { tr = { s, d, y: d.slice(0, 4), c: 0, pl: 0 }; map.set(k, tr); }
    tr.c = Math.max(tr.c, c);
    tr.pl += pl;
  }
  return [...map.values()];
}

function load(rows, name) {
  rawRows = rows; loadedNames = [name];
  trades = groupTrades(rows);
  const seen = new Set(); strategies = [];
  for (const [s] of rows) if (!seen.has(s)) { seen.add(s); strategies.push(s); }
  enabled = new Set(strategies);
  openStrat = new Set(strategies); openYear = new Set();
  const dates = trades.map(t => t.d).sort();
  document.getElementById('meta').textContent =
    `${name} · ${rows.length.toLocaleString()} rows · ${trades.length.toLocaleString()} trades · ${dates[0]} to ${dates[dates.length - 1]}`;
  renderRail(); render();
}

function renderRail() {
  const list = document.getElementById('stratList');
  list.innerHTML = '';
  const counts = {};
  for (const t of trades) counts[t.s] = (counts[t.s] || 0) + 1;
  strategies.forEach((s, i) => {
    const id = 'strat' + i;
    const lab = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.id = id; cb.checked = enabled.has(s);
    cb.addEventListener('change', () => { cb.checked ? enabled.add(s) : enabled.delete(s); render(); });
    const name = document.createElement('span'); name.textContent = s;
    const n = document.createElement('span'); n.className = 'n'; n.textContent = counts[s].toLocaleString();
    lab.append(cb, name, n); list.append(lab);
  });
}

const money = v => (v < 0 ? '−' : '') + '$' + Math.abs(Math.round(v)).toLocaleString();
const plCell = v => `<td class="${v < 0 ? 'neg' : v > 0 ? 'pos' : ''}">${money(v)}</td>`;
const cells = (n, c, pl) => `<td>${n.toLocaleString()}</td><td>${c.toLocaleString()}</td>${plCell(pl)}`;

function render() {
  const body = document.getElementById('body');
  let html = '', T = { n: 0, c: 0, pl: 0 };
  for (const s of strategies) {
    if (!enabled.has(s)) continue;
    const mine = trades.filter(t => t.s === s);
    const byYear = new Map();
    for (const t of mine) {
      if (!byYear.has(t.y)) byYear.set(t.y, new Map());
      const byDay = byYear.get(t.y);
      const d = byDay.get(t.d) || { n: 0, c: 0, pl: 0 };
      d.n++; d.c += t.c; d.pl += t.pl; byDay.set(t.d, d);
    }
    const S = { n: 0, c: 0, pl: 0 };
    let inner = '';
    const sOpen = openStrat.has(s);
    for (const y of [...byYear.keys()].sort()) {
      const byDay = byYear.get(y), Y = { n: 0, c: 0, pl: 0 };
      let days = '';
      const key = s + '|' + y, yOpen = openYear.has(key);
      for (const d of [...byDay.keys()].sort()) {
        const v = byDay.get(d);
        Y.n += v.n; Y.c += v.c; Y.pl += v.pl;
        if (sOpen && yOpen) days += `<tr class="day"><td>${d}</td>${cells(v.n, v.c, v.pl)}</tr>`;
      }
      S.n += Y.n; S.c += Y.c; S.pl += Y.pl;
      if (sOpen) inner += `<tr class="year${yOpen ? '' : ' collapsed'}" data-year="${key}"><td><span class="tri">▼</span> ${y}</td>${cells(Y.n, Y.c, Y.pl)}</tr>${days}`;
    }
    T.n += S.n; T.c += S.c; T.pl += S.pl;
    html += `<tr class="strategy${sOpen ? '' : ' collapsed'}" data-strat="${s.replace(/"/g, '&quot;')}"><td><span class="tri">▼</span> ${s.replace(/</g, '&lt;')}</td>${cells(S.n, S.c, S.pl)}</tr>${inner}`;
  }
  body.innerHTML = html || '<tr><td colspan="4" class="empty">No strategies selected.</td></tr>';
  document.getElementById('tTrades').textContent = T.n.toLocaleString();
  document.getElementById('tCtr').textContent = T.c.toLocaleString();
  const tp = document.getElementById('tPl'); tp.textContent = money(T.pl); tp.className = T.pl < 0 ? 'neg' : 'pos';
}

document.getElementById('body').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  if (tr.dataset.strat !== undefined) { const s = tr.dataset.strat; openStrat.has(s) ? openStrat.delete(s) : openStrat.add(s); render(); }
  else if (tr.dataset.year) { const k = tr.dataset.year; openYear.has(k) ? openYear.delete(k) : openYear.add(k); render(); }
});
document.getElementById('allOn').onclick = () => { enabled = new Set(strategies); renderRail(); render(); };
document.getElementById('allOff').onclick = () => { enabled = new Set(); renderRail(); render(); };
document.getElementById('expandYears').onclick = () => { openStrat = new Set(strategies); openYear = new Set(); render(); };
document.getElementById('expandDays').onclick = () => {
  openStrat = new Set(strategies); openYear = new Set(trades.map(t => t.s + '|' + t.y)); render();
};
document.getElementById('collapseAll').onclick = () => { openStrat = new Set(); openYear = new Set(); render(); };

// CSV parsing for dropped files (quoted fields, embedded commas, BOM).
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1);
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error('Could not read ' + file.name));
    fr.readAsText(file);
  });
}

function rowsFrom(text, name) {
  const all = parseCSV(text);
  const head = all[0] || [], col = n => head.indexOf(n);
  const need = ['Strategy', 'Date Opened', 'Time Opened', 'No. of Contracts', 'P/L'];
  const missing = need.filter(n => col(n) < 0);
  if (missing.length) throw new Error(name + ' is not an Option Omega trade log. Missing columns: ' + missing.join(', '));
  const [cs, cd, ct, cc, cp] = need.map(col);
  return all.slice(1).map(r => [r[cs], r[cd], r[ct], parseInt(r[cc], 10) || 0, parseFloat(r[cp]) || 0]);
}

// Load one or more CSVs. `append` merges them into whatever is already shown;
// otherwise they replace it. Rows are never deduplicated: Option Omega can log
// two legs of one condor as identical rows, so the only safe guard is skipping a
// file whose name is already loaded.
async function ingest(fileList, append) {
  const err = document.getElementById('err'); err.hidden = true;
  const files = [...fileList].filter(f => /\.csv$/i.test(f.name) || f.type === 'text/csv');
  if (!files.length) { err.textContent = 'Choose a .csv file.'; err.hidden = false; return; }
  try {
    const texts = await Promise.all(files.map(readFile));
    let rows = [], names = [], skipped = [];
    if (append) { rows = rawRows.slice(); names = loadedNames.slice(); }
    texts.forEach((t, i) => {
      const name = files[i].name;
      if (names.includes(name)) { skipped.push(name); return; }
      rows.push(...rowsFrom(t, name));
      names.push(name);
    });
    if (!rows.length) throw new Error('No trade rows found.');
    const label = names.length === 1 ? names[0] : names.length + ' files';
    load(rows, label);
    loadedNames = names;
    if (skipped.length) { err.textContent = 'Already loaded, skipped: ' + skipped.join(', '); err.hidden = false; }
  } catch (e) { err.textContent = e.message; err.hidden = false; }
}
const fileIn = document.getElementById('file'), fileAppendIn = document.getElementById('fileAppend');
document.getElementById('uploadBtn').addEventListener('click', () => { fileIn.value = ''; fileIn.click(); });
document.getElementById('appendBtn').addEventListener('click', () => { fileAppendIn.value = ''; fileAppendIn.click(); });
fileIn.addEventListener('change', e => { if (e.target.files.length) ingest(e.target.files, false); });
fileAppendIn.addEventListener('change', e => { if (e.target.files.length) ingest(e.target.files, true); });
const drop = document.getElementById('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) ingest(e.dataTransfer.files, false); });
drop.addEventListener('click', () => { fileIn.value = ''; fileIn.click(); });
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.value = ''; fileIn.click(); } });
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) ingest(e.dataTransfer.files, false); });

load(SEED, SEED_NAME);
</script>
